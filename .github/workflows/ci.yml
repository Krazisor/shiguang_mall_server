name: Build and test

on:
  # Keep the workflow available for an occasional manual verification, but
  # do not run Maven/Docker packaging on pushes or pull requests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: market
          MYSQL_USER: shiguang_app
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/market?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: shiguang_app
      DB_PASSWORD: test-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and package application
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload packaged JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-market-${{ github.sha }}
          path: target/app.jar
          if-no-files-found: error
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker image can be built
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shiguang-market:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
